name: Release

# Builds, scans, publishes, signs and attests the API image for every change
# merged to main. Code reaching main has already passed the CI workflow (the
# branch ruleset requires it), so this workflow only produces the artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC token: for AWS (assume role) and Sigstore (keyless signing)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt a half-finished publish

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: medibook/api
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
  COSIGN_VERSION: "3.1.3"
  COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
  SYFT_VERSION: "1.54.0"
  SYFT_SHA256: "54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860"

jobs:
  publish:
    name: Build, sign and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tools are downloaded as release binaries and only used if their checksums
      # match the pinned values. No third-party actions run in this workflow.
      - name: Install Trivy, Cosign and Syft
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          tar -xzf trivy.tar.gz -C bin trivy
          curl -sSfL -o bin/cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  bin/cosign" | sha256sum --check --strict
          chmod +x bin/cosign
          curl -sSfL -o syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum --check --strict
          tar -xzf syft.tar.gz -C bin syft
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build image
        run: docker build -t medibook:"${GITHUB_SHA}" .

      - name: Scan image (block fixable HIGH and CRITICAL)
        run: trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --no-progress medibook:"${GITHUB_SHA}"

      # Exchange the workflow's GitHub OIDC token for short-lived AWS credentials.
      # The role trusts only this repository's main branch (see infra/bootstrap).
      - name: Assume AWS release role
        env:
          ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
        run: |
          test -n "$ROLE_ARN" || { echo "Repository variable AWS_RELEASE_ROLE_ARN is not set"; exit 1; }
          TOKEN=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::${TOKEN}"
          CREDS=$(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" \
            --role-session-name "github-release-${GITHUB_RUN_ID}" --web-identity-token "$TOKEN" \
            --duration-seconds 3600 --query Credentials --output json)
          for pair in AWS_ACCESS_KEY_ID:AccessKeyId AWS_SECRET_ACCESS_KEY:SecretAccessKey AWS_SESSION_TOKEN:SessionToken; do
            value=$(echo "$CREDS" | jq -r ".${pair#*:}")
            echo "::add-mask::${value}"
            echo "${pair%%:*}=${value}" >> "$GITHUB_ENV"
          done
          echo "AWS_DEFAULT_REGION=${AWS_REGION}" >> "$GITHUB_ENV"

      - name: Push image to ECR
        id: push
        run: |
          REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          REPO="${REGISTRY}/${ECR_REPOSITORY}"
          TAG="${GITHUB_SHA::12}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag medibook:"${GITHUB_SHA}" "${REPO}:${TAG}"
          docker push "${REPO}:${TAG}"
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "ref=${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: syft scan "registry:${REF}" -o cyclonedx-json=sbom.cdx.json

      # Keyless signing: Sigstore issues a short-lived certificate bound to this
      # workflow's identity; no signing key exists to leak or rotate.
      - name: Sign image and attach SBOM attestation
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"

      - name: Verify signature and attestation
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$REF" > /dev/null
          cosign verify-attestation --type cyclonedx \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$REF" > /dev/null
          echo "Signature and SBOM attestation verified for $REF"

      - name: Release summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ steps.push.outputs.tag }}
        run: |
          {
            echo "### Published image"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Signed by | \`.github/workflows/release.yml@${GITHUB_REF}\` |"
            echo ""
            echo "Deploy with \`image_digest = \"${DIGEST}\"\` after verifying it with \`scripts/verify-image.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of ECR
        if: always()
        run: docker logout "$(aws sts get-caller-identity --query Account --output text 2>/dev/null).dkr.ecr.${AWS_REGION}.amazonaws.com" || true
