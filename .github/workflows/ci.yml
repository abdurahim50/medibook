name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs can read the repository and nothing else.
permissions:
  contents: read

# Cancel an older run when a newer commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  sast:
    name: SAST 
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          
   
# Scanners are installed only in CI, at pinned versions, so they never
      # mix with the application's own dependencies.

      - name: Install scanners
        run: python -m pip install bandit==1.9.4 semgrep==1.178.0

      - name: Bandit (python secuirty linter)
        run: bandit -r app --severity-level medium --confidence-level medium

      - name: Semgrep (OWASP and python rules)
        run: semgrep --config p/python --config p/owasp-top-ten --error --metrics=off app


# SCA (Software Composition Analysis)
  dependencies:
    name: Dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # Checks every pinned package against the Python vulnerability database.
      # --strict fails the job if any package cannot be checked.
      - name: Audit dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt --strict
        