name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs can read the repository and nothing else.
permissions:
  contents: read

# Cancel an older run when a newer commit is pushed to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Tests run against a real PostgreSQL, the same engine as production.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: medibook
          POSTGRES_PASSWORD: ci-throwaway-password # disposable container, test data only
          POSTGRES_DB: medibook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U medibook -d medibook_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: medibook
      PGPASSWORD: ci-throwaway-password
      PGDATABASE: medibook_test
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ensure the PostgreSQL client library is present
        run: ldconfig -p | grep -q 'libpq.so.5 ' || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq5; }

      - name: Run tests
        run: python -m pytest -q

  sast:
    name: SAST 
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          
   
# Scanners are installed only in CI, at pinned versions, so they never
      # mix with the application's own dependencies.

      - name: Install scanners
        run: python -m pip install bandit==1.9.4 semgrep==1.178.0

      - name: Bandit (python security linter)
        run: bandit -r app --severity-level medium --confidence-level low

      - name: Semgrep (OWASP and python rules)
        if: ${{ !cancelled() }}
        run: semgrep --config p/python --config p/owasp-top-ten --error --metrics=off app


# SCA (Software Composition Analysis)
  dependencies:
    name: Dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      # Checks every pinned package against the Python vulnerability database.
      # --strict fails the job if any package cannot be checked.
      - name: Audit dependencies
        run: pip-audit -r requirements.txt -r requirements-dev.txt --strict


# secrets scanning
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the official release
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The binary is only used if its checksum matches the pinned value,
      # so a tampered download cannot run in the pipeline.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan git history for secrets
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  image:
    name: Image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TRIVY_VERSION: "0.75.0"
      # SHA-256 of trivy_0.75.0_Linux-64bit.tar.gz from the official release
      TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The CLI binary is used instead of a marketplace action, and only runs
      # if its checksum matches, so a re-pointed tag cannot change what executes.
      - name: Install Trivy
        run: |
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy

      - name: Scan Dockerfile for misconfigurations
        run: ./trivy config --exit-code 1 --severity HIGH,CRITICAL .

      - name: Build image
        run: docker build -t medibook:${{ github.sha }} .

      # Fails on HIGH or CRITICAL vulnerabilities that have a fix available.
      - name: Scan image for vulnerabilities
        run: ./trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --no-progress medibook:${{ github.sha }}
  policy:
    name: Policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONFTEST_VERSION: "0.71.1"
      # SHA-256 of conftest_0.71.1_Linux_x86_64.tar.gz from the official release
      CONFTEST_SHA256: "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Conftest
        run: |
          curl -sSfL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tar.gz" | sha256sum --check --strict
          tar -xzf conftest.tar.gz conftest

      - name: Check policy formatting
        run: ./conftest fmt --check policy/terraform

      - name: Unit-test the policies
        run: ./conftest verify --policy policy/terraform --no-color

      # The policies themselves are tested here. Real plans are checked before
      # every apply with scripts/policy-check.sh (see docs/deployment.md).
      - name: Compliant plan passes
        run: ./conftest test --policy policy/terraform --no-color policy/fixtures/plan-compliant.json

      - name: Non-compliant plan is blocked
        run: |
          if ./conftest test --policy policy/terraform --no-color policy/fixtures/plan-violations.json > result.txt; then
            echo "::error::policy/fixtures/plan-violations.json passed; the policies failed to block it"
            exit 1
          fi
          cat result.txt
          # A crash or parse error also exits non-zero, so check that every rule fired.
          for id in 01 02 03 04 05 06 07 08 09 10; do
            grep -q "^FAIL .* MB-POL-${id} " result.txt || { echo "::error::MB-POL-${id} did not fire"; exit 1; }
          done
          echo "Blocked as expected: every rule fired."

  dast:
    name: DAST
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t medibook:dast .

      # Runs the hardened container, signs in as a synthetic patient and runs an
      # authenticated OWASP ZAP API scan. Fails on any alert not accepted in .zap/rules.tsv.
      - name: ZAP API scan
        run: scripts/dast-scan.sh medibook:dast zap-report

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: zap-report/
          retention-days: 14

  terraform:
    name: Terraform plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job with an OIDC token: it assumes a read-only AWS role.
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TERRAFORM_VERSION: "1.16.0"
      # SHA-256 of terraform_<version>_linux_amd64.zip from releases.hashicorp.com
      TERRAFORM_SHA256: "41d05b927aa174f15d1228c4eba832a323b716c68b415ef5a00179f46cc602d3"
      COSIGN_VERSION: "3.1.3"
      COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
      CONFTEST_VERSION: "0.71.1"
      CONFTEST_SHA256: "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform, Cosign and Conftest
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -sSfL -o terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum --check --strict
          unzip -q terraform.zip terraform -d bin
          curl -sSfL -o bin/cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  bin/cosign" | sha256sum --check --strict
          chmod +x bin/cosign
          curl -sSfL -o conftest.tar.gz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tar.gz" | sha256sum --check --strict
          tar -xzf conftest.tar.gz -C bin conftest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      # Read-only role: can read the image repository and the OIDC provider,
      # nothing else (see infra/bootstrap). It has no access to Terraform state.
      - name: Assume AWS plan role
        env:
          ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          test -n "$ROLE_ARN" || { echo "Repository variable AWS_PLAN_ROLE_ARN is not set"; exit 1; }
          TOKEN=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::${TOKEN}"
          CREDS=$(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" \
            --role-session-name "github-plan-${GITHUB_RUN_ID}" --web-identity-token "$TOKEN" \
            --duration-seconds 3600 --query Credentials --output json)
          for pair in AWS_ACCESS_KEY_ID:AccessKeyId AWS_SECRET_ACCESS_KEY:SecretAccessKey AWS_SESSION_TOKEN:SessionToken; do
            value=$(echo "$CREDS" | jq -r ".${pair#*:}")
            echo "::add-mask::${value}"
            echo "${pair%%:*}=${value}" >> "$GITHUB_ENV"
          done

      # Plans start from an empty local state: the policies judge the whole
      # desired configuration, and the state bucket stays out of reach of
      # pull request code. The override file replaces the S3 backend for CI only.
      - name: Use an empty local state
        run: |
          for dir in infra infra/bootstrap; do
            printf 'terraform {\n  backend "local" {}\n}\n' > "$dir/ci_backend_override.tf"
          done

      - name: Plan and check the bootstrap stack
        working-directory: infra/bootstrap
        run: |
          terraform init -input=false -no-color > /dev/null
          terraform validate -no-color
          terraform plan -input=false -no-color -lock=false -out=plan.tfplan > plan.log || { cat plan.log; exit 1; }
          grep -E "^Plan:" plan.log
          terraform show -json plan.tfplan > plan.json
          conftest test --no-color --parser json --policy ../../policy/terraform plan.json

      # Plans the full environment with the latest image published by the
      # release workflow, so the plan also proves that image's signature verifies.
      - name: Plan and check the environment stack
        working-directory: infra
        run: |
          DIGEST=$(aws ecr describe-images --repository-name medibook/api --filter tagStatus=TAGGED \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageDigest' --output text)
          echo "Latest release image: ${DIGEST}"
          terraform init -input=false -no-color > /dev/null
          terraform validate -no-color
          terraform plan -input=false -no-color -lock=false -out=plan.tfplan \
            -var 'allowed_cidrs=["198.51.100.10/32"]' \
            -var "alarm_email=alerts@example.com" \
            -var "image_digest=${DIGEST}" > plan.log 2>&1 || { cat plan.log; exit 1; }
          grep -E "^Plan:|image_signature" plan.log
          terraform show -json plan.tfplan > plan.json
          conftest test --no-color --parser json --policy ../policy/terraform plan.json

